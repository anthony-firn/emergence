[package]
name = "spectral-cuda"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "CUDA + cuFFT backend for the pseudo-spectral Navier–Stokes solver"

[dependencies]
num-complex = "0.4"
spectral-core = { path = "../spectral-core" }
cudarc = { version = "0.19", default-features = false, features = ["std", "driver", "nvrtc", "cufft", "cuda-12090", "dynamic-loading"] }
