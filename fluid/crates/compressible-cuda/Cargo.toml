[package]
name = "compressible-cuda"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "CUDA backend for the compressible hybrid central/WCNS solver"

[dependencies]
compressible = { path = "../compressible" }
cudarc = { version = "0.19", default-features = false, features = ["std", "driver", "nvrtc", "cuda-12090", "dynamic-loading"] }
