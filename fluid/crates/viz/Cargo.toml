[package]
name = "viz"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Rendering and visual effects for the CAD kernel and the solvers: sphere-traced implicit geometry, spectral path tracing, simulation fields, render passes and parameter-driven animation"

[dependencies]
cad = { path = "../cad" }
emergence = { path = "../emergence" }
num-complex = "0.4"
photonics = { path = "../photonics" }
geometry = { path = "../geometry" }
radiation = { path = "../radiation" }
waveoptics = { path = "../waveoptics" }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"

[dev-dependencies]
wetting = { path = "../wetting" }
