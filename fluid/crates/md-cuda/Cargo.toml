[package]
name = "md-cuda"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "CUDA backend for molecular dynamics with Lennard-Jones pair potentials"

[dependencies]
md = { path = "../md" }
materials = { path = "../materials" }
cudarc = { version = "0.19", default-features = false, features = ["std", "driver", "nvrtc", "cuda-12090", "dynamic-loading"] }
