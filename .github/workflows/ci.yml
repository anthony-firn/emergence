name: CPU models and browser build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAYON_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fluid
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: CAD revision and geometry checks
        run: node --test web/test_cad_repository.mjs web/test_cad_studio.mjs
      - name: Engine and browser-model checks
        working-directory: fluid
        run: cargo test --locked -p emergence -p emergence-web
      - name: Exact fluid references
        working-directory: fluid
        run: cargo test --locked -p spectral-core --test exact
      - name: Optical expansion versus series
        working-directory: fluid
        run: cargo test --locked -p photonics --test mie_ladder rayleigh2_returns_less_than_it_claims
      - name: CPU command-line build
        working-directory: fluid
        run: cargo check --locked -p fluid-cli
      - name: Compile browser models
        run: python3 web/build.py
